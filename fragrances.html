<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Fragrances | Felipe's Fragrance Masterlist</title>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar__container">
        <a href="index.html"><img src="assets/logo.png" id="logo" alt="Logo" /></a>
        <div class="navbar__toggle" id="mobile-menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
        <ul class="navbar__menu" id="nav-menu">
          <li class="navbar__item">
            <a href="index.html" class="navbar__links">Home</a>
          </li>
          <li class="navbar__item">
            <a href="fragrances.html" class="navbar__links">Fragrances</a>
          </li>
          <li class="navbar__item">
            <a href="about.html" class="navbar__links">About</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="content">
      <h1>FRAGRANCE CLONES</h1>
      <p>Designer fragrances paired with their highest-rated affordable dupes from Fragrantica.</p>
    </div>

    <div class="search-section">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search by fragrance or brand..."
      />
      <select class="filter-select" id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="men">Men</option>
        <option value="women">Women</option>
        <option value="unisex">Unisex</option>
      </select>
    </div>

    <div class="results-count" id="resultsCount"></div>
    <div class="fragrance-grid" id="fragranceGrid"></div>

    <footer class="footer">
      <p>&copy; Felipe's Fragrance Masterlist</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
